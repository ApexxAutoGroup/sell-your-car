<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apexx Auto Group | Sell Your Car</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>

<div class="logo">

<h1>APEXX AUTO GROUP</h1>

<p>Sell Your Car</p>

</div>

</header>

<section class="hero">

<h2>Get Your Free Car Valuation</h2>

<p>Enter your registration number below.</p>

</section>

<section class="lookup">

<input
type="text"
id="registration"
placeholder="Enter Registration">

<button id="lookupBtn">
Find My Car
</button>

</section>

<section id="vehicleResult" class="hidden">

<h2>Vehicle Details</h2>

<div class="details">

<p><strong>Make:</strong> <span id="make"></span></p>

<p><strong>Model:</strong> <span id="model"></span></p>

<p><strong>Year:</strong> <span id="year"></span></p>

<p><strong>Fuel:</strong> <span id="fuel"></span></p>

<p><strong>Colour:</strong> <span id="colour"></span></p>

</div>

</section>

<section id="valuationForm" class="hidden">

<h2>Your Details</h2>

<input
type="number"
id="mileage"
placeholder="Mileage">

<select id="condition">

<option>Excellent</option>

<option>Good</option>

<option>Average</option>

<option>Poor</option>

</select>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="tel"
id="phone"
placeholder="Phone Number">

<button id="submitBtn">

Get My Free Valuation

</button>

</section>

<script src="config.js"></script>

<script src="script.js"></script>

</body>
</html>
